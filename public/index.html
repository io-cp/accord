<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2P ScreenShare</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
  :root {
    --bg: #0d1117;           
    --panel: #161b22;        
    --panel-2: #21262d;      
    --border: #30363d;       
    --text: #c9d1d9;         
    --text-dim: #8b949e;     
    --accent: #238636;       
    --accent-2: #2ea043;     
    --red: #da3633;          
    --radius: 12px;
    --header-h: 60px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  button { font-family: inherit; }

  #landing { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { width: 100%; max-width: 380px; background: var(--panel); padding: 30px; border-radius: var(--radius); box-shadow: 0 4px 20px rgba(0,0,0,0.2); border: 1px solid var(--border); display: flex; flex-direction: column; }
  .logo h1 { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .sub { color: var(--text-dim); font-size: 13px; margin-bottom: 24px; line-height: 1.4; }
  .field { margin-bottom: 14px; text-align: left; }
  .field label { display: block; font-size: 11px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; margin-bottom: 6px; }
  input[type=text] { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 12px; font-size: 14px; outline: none; }
  input[type=text]:focus { border-color: var(--accent); }
  #joinCode { text-transform: uppercase; letter-spacing: 4px; font-family: monospace; font-weight: 700; text-align: center; }

  .btn { border: none; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer; color: #fff; background: var(--accent); transition: background .15s; }
  .btn:hover { background: var(--accent-2); }
  .btn.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  .btn.block { width: 100%; }
  .divider { display: flex; align-items: center; gap: 10px; color: var(--text-dim); font-size: 11px; text-transform: uppercase; margin: 20px 0; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .joinRow { display: flex; gap: 8px; }

  #room { display: none; flex: 1; flex-direction: column; min-height: 0; }
  header { height: var(--header-h); flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .codeChip { display: flex; align-items: center; gap: 8px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; cursor: pointer; color: var(--text); }
  .codeChip .code { font-family: monospace; font-size: 14px; font-weight: 700; color: var(--accent-2); }
  .spacer { flex: 1; }
  
  /* Estilos para os novos botões de controle na barra superior */
  .header-btn { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13.5px; font-weight: 600; transition: 0.2s; }
  .header-btn:hover { background: var(--panel-2); }
  
  #shareBtn { border: none; border-radius: 6px; padding: 8px 16px; font-size: 13.5px; font-weight: 700; cursor: pointer; color: #fff; background: var(--accent); margin-left: 10px; }
  #shareBtn.sharing { background: var(--red); }
  #leaveBtn { background: transparent; border: 1px solid var(--border); color: var(--text-dim); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  #leaveBtn:hover { background: rgba(218, 54, 51, 0.1); color: var(--red); border-color: var(--red); }

  #main { flex: 1; min-height: 0; display: flex; }
  #sidebar { width: 260px; flex-shrink: 0; border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .sideHead { padding: 16px 16px 8px; font-size: 11px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; }
  #userList { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .userRow { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px; margin-bottom: 4px; border: 1px solid transparent; border-radius: 8px; background: none; color: var(--text); text-align: left; }
  .userRow.sharing { cursor: pointer; background: var(--panel-2); border-color: var(--border); }
  .userRow.selected { border-color: var(--accent); }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--border); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex-shrink: 0; color: var(--text); }
  .userRow.sharing .avatar { background: var(--accent); color: #fff; }
  .userInfo { flex: 1; min-width: 0; }
  .userName { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .userStatus { font-size: 11px; color: var(--text-dim); }

  #stageArea { flex: 1; min-width: 0; min-height: 0; position: relative; display: flex; padding: 15px; }
  #grid { flex: 1; min-width: 0; min-height: 0; display: grid; gap: 15px; }
  #grid.focused .tile:not(.focus) { display: none; }
  #emptyState { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-dim); text-align: center; }

  .tile { position: relative; background: #000; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; min-width: 0; min-height: 0; cursor: pointer; }
  .tile.focus { cursor: zoom-out; }
  .tile video { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
  .tileBar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; padding: 12px; background: linear-gradient(transparent, rgba(0,0,0,.8)); color: white; font-size: 12px; font-weight: bold; }
</style>
</head>
<body>

<div id="landing">
  <div class="card">
    <div class="logo"><h1>P2P ScreenShare</h1></div>
    <div class="sub">Compartilhamento de tela direto ponto a ponto. Sem contas ou cadastros.</div>
    <div class="field">
      <label for="nameInput">Seu Nome</label>
      <input type="text" id="nameInput" maxlength="24" placeholder="Como outros vão te ver" autocomplete="off">
    </div>
    <button class="btn block" id="createBtn">Criar uma Sala</button>
    <div class="divider">ou entre com um código</div>
    <div class="joinRow">
      <input type="text" id="joinCode" maxlength="6" placeholder="••••••" autocomplete="off">
      <button class="btn ghost" id="joinBtn">Entrar</button>
    </div>
    <div id="landingError" style="color: var(--red); margin-top: 10px; font-size: 12px;"></div>
  </div>
</div>

<div id="room">
  <header>
    <button class="codeChip" id="codeChip" title="Copiar código/link">
      <span>SALA:</span> <span class="code" id="roomCodeLabel"></span>
    </button>
    
    <div class="spacer"></div>
    
    <!-- Novos botões de controle de voz -->
    <button id="micBtn" class="header-btn" title="Ativar Microfone">🎤 Voz</button>
    <button id="deafenBtn" class="header-btn" title="Silenciar todos os microfones">🔇 Safe Guard</button>
    
    <button id="shareBtn"><span class="btnLabel">Compartilhar Tela</span></button>
    <button id="leaveBtn">Sair</button>
  </header>
  
  <div id="main">
    <aside id="sidebar">
      <div class="sideHead">Participantes</div>
      <div id="userList"></div>
    </aside>
    <div id="stageArea">
      <div id="grid"></div>
      <div id="emptyState">Ninguém está compartilhando tela no momento.</div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
